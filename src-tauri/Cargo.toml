[package]
name = "cyber-cat"
version = "0.0.0"
description = "常驻桌面的赛博养猫"
edition = "2021"
# 1.77.2 而不是 1.77：tauri-plugin-notification 2.3 要求它。
# 差的是一个补丁号，而下调到 1.77 只能拿到该插件的 rc 版本。
rust-version = "1.77.2"

[lib]
name = "cyber_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 命令返回值需要自己的结构体（舞台几何有八个字段，返回元组读不懂）。
# tauri 本来就依赖同一个 serde，这里只是把它显式引进来好用 derive。
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [
  # 透明窗口在 macOS 上依赖私有 API。代价是无法上架 Mac App Store，
  # 这是 ADR 0003 已接受的取舍，直接分发 DMG 不受影响。
  "macos-private-api",
  "tray-icon",
  "image-png",
] }

# 系统通知。**只有生病这一级会发**（issue #13），饿了不发 - 那会把产品气质
# 从陪伴变成催促。
#
# 这是本项目唯一的 Tauri 插件，与 save.rs 里「读写 JSON 不引插件」的取舍不冲突：
# 那边标准库够用，这边不够。两条被否决的自己实现：
#   1. macOS 走 `osascript -e 'display notification'` - 通知的来源会显示成
#      「脚本编辑器」，而且要给用户文案做 shell 转义；Windows 侧还得另写一套 toast。
#   2. webview 里的 Web Notification API - WKWebView 默认不支持它，
#      在 macOS 上什么都不会发生，而这正是 MVP 唯一要验收的平台。
tauri-plugin-notification = "2"

# --- 读前台窗口的几何（ticket 12，特效 3.1）--------------------------------
#
# 两个平台都**不需要任何用户授权**，这是 ADR 0005 的结论，也是这几个依赖的选法：
# macOS 走 CGWindowList + NSWorkspace（免授权），**不迁移到 ScreenCaptureKit**
# （那会把免授权特性变成强授权特性）。
#
# 被否决的依赖：
#   1. `active-win-pos-rs` 0.11 - 两个平台的实现正好是我们要的写法，但它不暴露
#      「锁定 windowID 之后只查这一个」的增量查询（实测快五倍，验收项之一），
#      也不按 kCGWindowLayer 过滤，还硬编码了「宽或高小于 50 就跳过」。
#      自己写下来两个平台各三四十行，不值得为此背一个不能定制的依赖。
#   2. `xcap` - 为截图而生，0.9.7 仍在用 macOS 15 已废除的 CGWindowListCreateImage，
#      而且 `Window::all()` 一上来就调 CGPreflightScreenCaptureAccess 打 warning。
[target.'cfg(target_os = "macos")'.dependencies]
# 只要 NSWorkspace.frontmostApplication（拿前台 app 的 PID）。
# 版本与 tauri 自己依赖的 objc2-* 对齐（0.3.2），不引入第二份 objc2。
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
  "NSRunningApplication",
  # processIdentifier() 的返回类型是 libc::pid_t，这个 feature 不开的话那个方法
  # 压根不会被生成出来（objc2 的绑定按 feature 逐方法开关）。
  "libc",
] }
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
# DWMWA_EXTENDED_FRAME_BOUNDS 是硬要求：GetWindowRect 在**最大化窗口**下顶边
# 比可见顶边高 11 像素（Windows 11 25H2 实测），猫会浮空。
# GetDpiForWindow 用来按目标窗口所在显示器的 DPI 换算坐标。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
