<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>它离开了</title>
    <style>
      /*
       * 告别页。小尺寸、居中、用完即关（mvp-scope 第 7 节）。
       *
       * 呈现要求（issue #13）：**安静。不恐怖，也不搞笑。**
       * 落到样式上是三条具体的取舍：
       *
       * 1. **没有红色，没有黑白照的重边框，没有任何图标。** 配色沿用领养窗口那套
       *    深蓝夜色 - 同一只猫来的时候和走的时候是同一个世界，换成一片惨白或者
       *    加一道黑框都会把「安静」变成「肃穆」，而后者离恐怖只有一步。
       * 2. **遗照是它活着时的样子**：坐姿、眼睛睁着，只做很轻的降饱和
       *    （saturate 0.6，像一张旧照片）。趴着或蜷着看起来像遗体，试过，不行。
       * 3. **两块列表各自滚动，窗口尺寸写死。** 日记可能有几百条，让窗口跟着长
       *    会在小屏上变成一面墙。
       *
       * 尺寸不写死在这里：窗口与遗照的尺寸都来自 src/farewell/constants.ts，
       * 由 main.ts 写进 CSS 变量。数字散成两份迟早对不上（与 adopt.html 同理）。
       */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e1a;
        color: #d8dcf0;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        /* 上边距 = 自绘标题条 + 原来那 18。高度只有一份，见 adopt.html 同处注释 */
        padding: calc(var(--chrome-h) + 18px) 22px 16px;
      }

      /* --- 遗照与陪伴记录 --- */
      #head {
        display: flex;
        gap: 16px;
        align-items: flex-end;
      }
      #frame {
        position: relative;
        flex: none;
        width: var(--portrait-w);
        height: var(--portrait-h);
      }
      /* 照片贴框下沿：所有姿态的脚底线都在同一行，贴底才站在地上 */
      #portrait {
        position: absolute;
        left: 0;
        bottom: 0;
        display: block;
        image-rendering: pixelated;
        -webkit-user-drag: none;
        /* 像一张旧照片。不做 grayscale - 全灰会把「安静」推成「肃穆」 */
        filter: saturate(0.6);
      }
      #who {
        padding-bottom: 4px;
      }
      #name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #d8dcf0;
      }
      #life {
        margin-top: 6px;
        font-size: 12.5px;
        color: #5b6488;
      }
      #companion {
        margin-top: 10px;
        font-size: 13px;
        color: #aab3d8;
      }

      h2 {
        margin: 18px 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #4a5379;
      }

      /* --- 一生日记 --- */
      #diary {
        flex: 1 1 auto;
        min-height: 96px;
        overflow-y: auto;
        padding-right: 6px;
      }
      .day {
        margin-bottom: 12px;
      }
      .day > .when {
        font-size: 11.5px;
        color: #4a5379;
        margin-bottom: 3px;
      }
      .day p {
        font-size: 13px;
        line-height: 1.75;
        color: #aab3d8;
      }
      .day p.important {
        color: #d8dcf0;
      }
      #diary .empty,
      #archive .empty {
        font-size: 12.5px;
        color: #4a5379;
      }

      /* --- 猫的档案 --- */
      #archive {
        flex: 0 0 auto;
        max-height: 118px;
        overflow-y: auto;
        padding-right: 6px;
      }
      .cat {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        text-align: left;
        font-family: inherit;
        font-size: 12.5px;
        color: #aab3d8;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 6px 8px;
        cursor: pointer;
      }
      .cat:hover {
        border-color: #2c3a68;
      }
      .cat[aria-current='true'] {
        background: #161c34;
        border-color: #2c3a68;
      }
      .cat .n {
        color: #d8dcf0;
      }
      .cat .b {
        color: #5b6488;
      }
      .cat .s {
        margin-left: auto;
        color: #4a5379;
        font-variant-numeric: tabular-nums;
      }

      /* --- 送别 --- */
      #foot {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }
      #note {
        font-size: 12px;
        color: #4a5379;
        line-height: 1.5;
      }
      button.primary {
        flex: none;
        margin-left: auto;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        padding: 9px 18px;
        border: 1px solid #4deeea;
        background: #4deeea;
        color: #07091a;
      }
      button.primary:hover:enabled {
        background: #7ef4f1;
        border-color: #7ef4f1;
      }
      button.primary:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="head">
      <div id="frame"><canvas id="portrait"></canvas></div>
      <div id="who">
        <div id="name"></div>
        <div id="life"></div>
        <div id="companion"></div>
      </div>
    </div>

    <h2>它的一生</h2>
    <div id="diary"></div>

    <h2>猫的档案</h2>
    <div id="archive"></div>

    <div id="foot">
      <p id="note"></p>
      <button id="again" class="primary">再养一只</button>
    </div>

    <script type="module" src="/src/farewell/main.ts"></script>
  </body>
</html>
