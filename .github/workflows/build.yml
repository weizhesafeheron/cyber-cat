# GitHub 帮你构建两个平台的安装包。
#
# 为什么必须在各自的平台上构建：Windows 的包要 MSVC 工具链与资源编译器，
# macOS 的包要 Xcode 的签名与 hdiutil，两边都不能交叉编译。所以是一个矩阵，
# 而不是一台机器出两份产物。
#
# 什么时候跑：
# - 手动点（workflow_dispatch）：两个平台都出，产物存成 artifact，
#   在那次运行的页面里下载（zip），保留 30 天。
#   这条路的意义就是「不装任何开发环境也能拿到两个平台的包」，所以不做平台过滤。
# - 推 v 开头的 tag：额外建一个**草稿** Release 并把安装包挂上去。草稿是刻意的 -
#   发布前你还要自己在 macOS 与 Windows 上各装一次（见 issue #16）。
# - **不在每次 push 到 main 时跑。** 这个仓库的提交绝大多数只改前端与文档，
#   而一次两平台构建要十几分钟；要包的时候手动点一下就有。测试那个 job 才是每次都跑的。
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一个分支上新的一次推送会取消上一次还没跑完的，省掉排队的 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 每次 push 与 PR 都跑。跑在 ubuntu 上：测试全是 node 里的纯逻辑，
  # 不需要 webview 也不需要 Rust - 世界层与渲染层本来就是平台无关的。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    # tag 与手动触发才构建。push 到 main 只跑上面那个 test。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      # 建 Release 要写权限。只有这个 job 需要。
      contents: write
    strategy:
      # 一个平台挂了另一个照样出包 - 只有一半能装也比两手空空有用
      fail-fast: false
      matrix:
        # **不要在这里放表达式。** 试过用 exclude + ${{ }} 做「只跑某一个平台」的开关，
        # 结果整个 build job 根本没被生成出来（矩阵展开在 workflow 级别就失败了，
        # 运行页面上只剩 test，没有任何一条能对上的报错）。
        # 仓库是 public、runner 免费，那个开关本来的理由（省 macOS 的 10 倍计费）也不存在了。
        include:
          - platform: macos-latest
            # universal：一个 DMG 同时支持 Apple Silicon 与 Intel。
            # 代价是 Rust 要编两遍（macOS runner 上大约多五分钟），
            # 换来的是下载的人不需要先搞清楚自己的芯片是哪种。
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Rust 的编译产物缓存。第一次跑要十几分钟，之后只重编我们自己的 crate。
      # workspaces 指到 src-tauri：Cargo.toml 在那儿，不在仓库根上。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: npm ci

      # tauri-action 会调 `tauri build`，而它自己会先跑 beforeBuildCommand
      # （npm run build = tsc --noEmit && vite build），所以前端不用单独构建一步。
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #
          # **这里刻意不写 APPLE_CERTIFICATE 那一组签名变量。** 踩过：
          # GitHub 对**不存在的 secret 会注入空字符串**，于是 tauri-action 看到变量
          # 「存在」，就真的拿一段空 base64 去 `security import`，打包最后一步炸掉：
          #   security: SecKeychainItemImport: One or more parameters passed to a function were not valid.
          #   failed to bundle project: failed codesign application
          # 而代码其实全编过了（universal 二进制都产出了）。**空的 secret 不等于没有 secret。**
          #
          # 等真的有 Developer ID 了再加回来，而且必须是「secret 配齐之后」才加：
          #   APPLE_CERTIFICATE（base64 的 .p12）、APPLE_CERTIFICATE_PASSWORD、
          #   APPLE_SIGNING_IDENTITY、APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID
          # 没配齐就留着不写 - 未签名的包只是让下载的人多点两下（见 releaseBody），
          # 而写了空值会让整条流水线出不了包。
        with:
          args: ${{ matrix.args }}
          # tagName 为空时 tauri-action 只构建、不碰 Release。
          # 推 tag 才建，而且是草稿：发布前还要在两个平台各装一次。
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: true
          releaseBody: |
            桌面上一只 24 小时都在生活的像素猫。功能与已知限制见 README。

            **两个包都没有签名。**
            - macOS：第一次打开要右键点 → 打开 → 再点一次「打开」，或者去「系统设置 → 隐私与安全性」点「仍要打开」。
            - Windows：SmartScreen 会拦一下，点「更多信息」→「仍要运行」。需要 WebView2 运行时，Windows 10 上安装包会自己下载。

      # 把安装包拢进一个平铺的目录再上传。
      #
      # 直接上传原路径的话，zip 里会套着 release/bundle/nsis/ 这几层 -
      # upload-artifact 只会去掉所有匹配项的**公共前缀**，而 macOS 的 dmg 在
      # target/universal-apple-darwin/ 下、Windows 的 msi 在 target/ 下，
      # 公共前缀只到 src-tauri/target，剩下的目录全留在压缩包里，
      # 下载的人要点四五下才看到安装包。
      #
      # shell: bash 在 Windows runner 上也有（Git Bash），所以一份脚本两个平台通用。
      - name: 收拢安装包
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -type f \
            \( -path '*/bundle/dmg/*.dmg' \
            -o -path '*/bundle/msi/*.msi' \
            -o -path '*/bundle/nsis/*.exe' \) \
            -exec cp {} dist/ \;
          ls -l dist

      # 手动触发时把产物存成 artifact：那种情况下没有 Release 可挂。
      # if-no-files-found: error - 静默地上传一个空压缩包比失败更难查。
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: cybercat-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*
