<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CYBER-CAT</title>
    <style>
      /* 整页必须完全透明 - 任何背景色都会在桌面上变成一块可见的矩形 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      /*
       * 窗口是一个舞台（ADR 0007）：比猫宽得多，容纳猫加身后一小段爪印。
       * 猫在舞台里横向移动，舞台只在猫接近边缘时整体挪一次。
       */
      #stage {
        position: fixed;
        inset: 0;
      }
      /* 爪印垫在猫下面，且不参与任何指针交互 */
      #paws {
        position: absolute;
        left: 0;
        bottom: 0;
        image-rendering: pixelated;
        pointer-events: none;
      }
      /*
       * 抚摸时冒的爱心与吃饭时的台词气泡。两张都铺满舞台、盖在猫之上、不收指针事件。
       *
       * **少了这段定位规则它们会按文档流排下去**，于是画布跑到舞台外面，
       * 屏幕上什么都看不到而且不报错 - 透明窗口里这种缺陷完全没有症状。
       */
      #hearts,
      #say {
        position: absolute;
        left: 0;
        bottom: 0;
        image-rendering: pixelated;
        pointer-events: none;
      }
      /*
       * 回归气泡（ADR 0011）。舞台里的第三张画布，铺满舞台、盖在猫之上。
       *
       * `pointer-events: none` 不影响它可点：点击由 window 上的 pointerdown
       * 统一处理，落点是不是气泡由命中矩形判定（src/diary/bubble.ts）。
       * 让画布自己收事件反而会把猫的点击挡掉一块 - 画布铺满整个舞台。
       */
      #bubble {
        position: absolute;
        left: 0;
        bottom: 0;
        image-rendering: pixelated;
        pointer-events: none;
      }
      /*
       * 猫贴在舞台下沿：猫的脚在精灵的下沿，贴底才能站在"地面"上。
       * 横向位置由 display.place() 写 transform，不用 flex 居中 -
       * 命中测试量的是这个 canvas 的布局矩形，位置必须只有一个来源。
       */
      #cat {
        position: absolute;
        left: 0;
        bottom: 0;
        display: block;
        image-rendering: pixelated;
        /* 禁止选中与浏览器的默认拖拽 - 拖猫由 ticket 09 自己实现 */
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="paws"></canvas>
      <canvas id="cat"></canvas>
      <!-- 爱心与两种气泡都在猫之上：都从猫头顶冒出来，压在猫身后就看不见了 -->
      <canvas id="hearts"></canvas>
      <canvas id="say"></canvas>
      <canvas id="bubble"></canvas>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
