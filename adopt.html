<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>有猫停在你面前</title>
    <style>
      /*
       * 领养窗口。小尺寸、居中、用完即关（mvp-scope 第 7 节）。
       *
       * 呈现要求：**这是一次相遇，不是一张角色创建表单。**
       * 所以画面主体是雨夜与猫，文字只有一句旁白加一张小卡片，
       * 按钮说的是「再等等」与「就是它了」，不是「随机」与「确定」。
       *
       * 尺寸不写死在这里：夜幕高度与窗口尺寸都来自 src/adopt/constants.ts，
       * 由 main.ts 写进 CSS 变量。数字散成两份迟早对不上。
       */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e1a;
        color: #d8dcf0;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
      }
      /* 雨夜。猫在里面走动，走出边界的部分被裁掉，才有「从画面外走来」 */
      #night {
        position: relative;
        width: 100%;
        height: var(--sky-h);
        overflow: hidden;
      }
      #sky {
        position: absolute;
        inset: 0;
      }
      /*
       * 猫贴夜幕下沿：脚在精灵的下沿，贴底才站在地上。横向由 display.place() 写 transform。
       * z-index 让它压在下面那道渐变之上 - 渐变的高度会盖到猫的脚，
       * 而爪子被一层半透明的黑抹掉之后，猫看起来是浮在地上的。
       */
      #cat {
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 2;
        display: block;
        image-rendering: pixelated;
        -webkit-user-drag: none;
      }
      /* 夜幕与文字之间的过渡，避免出现一条生硬的分界线 */
      #night::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        height: 16px;
        background: linear-gradient(180deg, rgba(11, 14, 26, 0) 0%, #0b0e1a 100%);
        pointer-events: none;
      }

      #panel {
        padding: 6px 22px 18px;
      }
      #lede {
        font-size: 13.5px;
        line-height: 1.7;
        color: #aab3d8;
        min-height: 23px;
      }
      #lede b {
        color: #ffd94a;
        font-weight: 600;
      }

      #card {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      #breed {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #4deeea;
      }
      #shape {
        font-size: 12px;
        color: #5b6488;
      }
      #traits {
        display: flex;
        gap: 8px;
        list-style: none;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      #traits li {
        font-size: 12px;
        color: #d8dcf0;
        background: #161c34;
        border: 1px solid #2c3a68;
        border-radius: 999px;
        padding: 4px 12px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 18px;
      }
      .row[hidden] {
        display: none;
      }
      /*
       * 起名：输入框独占一行，按钮另起一行。
       *
       * 三样东西挤一行在 464 的窗口里放不下 - 输入框、「再想想」、「就叫这个」
       * 加起来会把确认按钮挤出右边界（实测被裁掉）。而且中文按钮的宽度随字体
       * 变化，Windows 换成 YaHei 之后余量还会不一样，靠调 gap 是压不住的。
       */
      #naming {
        margin-top: 18px;
      }
      /*
       * 打量这一步比起名少了一个输入框，按钮行往上顶 48 像素，于是窗口底下空出
       * 一块 - 空旷会让这一页看起来像个配置对话框。把两步的按钮行对齐到同一条线上：
       * 18（起名的上边距）+ 输入框 + 10（按钮行的上边距）正好是这里的 68（输入框实测 40 高）。
       * 好处不只是不空：**点「就是它了」时界面不会整体跳一下。**
       */
      #meeting {
        margin-top: 68px;
      }
      #naming[hidden] {
        display: none;
      }
      #naming .row {
        margin-top: 10px;
        justify-content: flex-end;
      }
      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        border-radius: 6px;
        padding: 9px 18px;
        border: 1px solid #2c3a68;
        background: #161c34;
        color: #aab3d8;
      }
      button:hover:enabled {
        border-color: #4deeea;
        color: #4deeea;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.primary {
        background: #4deeea;
        border-color: #4deeea;
        color: #07091a;
        font-weight: 600;
      }
      button.primary:hover:enabled {
        background: #7ef4f1;
        border-color: #7ef4f1;
        color: #07091a;
      }
      #name {
        display: block;
        width: 100%;
        font-family: inherit;
        font-size: 14px;
        color: #ffd94a;
        background: #07091a;
        border: 1px solid #2c3a68;
        border-radius: 6px;
        padding: 9px 12px;
        user-select: text;
      }
      #name:focus {
        outline: none;
        border-color: #4deeea;
      }
      #hint {
        margin-top: 8px;
        font-size: 12px;
        min-height: 17px;
        color: #5b6488;
      }
      #hint.bad {
        color: #f652a0;
      }
    </style>
  </head>
  <body>
    <div id="night">
      <canvas id="sky"></canvas>
      <canvas id="cat"></canvas>
    </div>

    <div id="panel">
      <p id="lede"></p>
      <div id="card">
        <span id="breed"></span>
        <span id="shape"></span>
      </div>
      <ul id="traits"></ul>

      <div class="row" id="meeting">
        <button id="next">再等等</button>
        <button id="keep" class="primary">就是它了</button>
      </div>

      <form id="naming" hidden>
        <!--
          刻意不写 maxlength：它按 UTF-16 长度截断，而名字的上限是按码点算的
          （src/adopt/name.ts）。写上之后 emoji 名字会被砍成一半额度，
          还会在半个代理对上截断。超长交给校验去说人话。
        -->
        <input id="name" type="text" autocomplete="off" placeholder="给它起个名字" />
        <div class="row">
          <button id="back" type="button">再想想</button>
          <button id="confirm" class="primary" type="submit">就叫这个</button>
        </div>
      </form>
      <p id="hint"></p>
    </div>

    <script type="module" src="/src/adopt/main.ts"></script>
  </body>
</html>
