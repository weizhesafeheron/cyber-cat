<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>选一只猫</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0b0e1a;
        --panel: #11162a;
        --panel-2: #161c34;
        --line: #2c3a68;
        --muted: #7882a8;
        --text: #d8dcf0;
        --cyan: #4deeea;
        --yellow: #ffd94a;
        --pink: #f652a0;
      }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; user-select: none;
      }
      body { padding-top: var(--chrome-h); }
      button, input { font: inherit; }
      button {
        cursor: pointer; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel-2); color: #aab3d8;
      }
      button:hover:enabled { border-color: var(--cyan); color: var(--cyan); }
      button:disabled { opacity: .46; cursor: default; }
      button.primary {
        padding: 10px 18px; background: var(--cyan); border-color: var(--cyan);
        color: #07091a; font-weight: 650;
      }
      button.primary:hover:enabled { background: #7ef4f1; color: #07091a; }
      #layout {
        height: 100%; display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(390px, .92fr);
      }
      #encounter {
        min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line);
      }
      #night {
        position: relative; width: 100%; height: var(--sky-h); min-height: var(--sky-h); overflow: hidden;
      }
      #sky { position: absolute; inset: 0; }
      #cat {
        position: absolute; left: 0; bottom: 0; z-index: 2; display: block;
        image-rendering: pixelated; -webkit-user-drag: none;
      }
      #night::after {
        content: ''; position: absolute; inset: auto 0 0; z-index: 1; height: 24px;
        background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none;
      }
      #story {
        min-height: 0; flex: 1; padding: 16px 25px 22px; display: flex; flex-direction: column;
      }
      #lede { color: #aab3d8; font-size: 14px; line-height: 1.7; min-height: 48px; }
      #lede b { color: var(--yellow); font-weight: 600; }
      #card { display: flex; align-items: baseline; gap: 12px; margin-top: 9px; }
      #breed { color: var(--cyan); font-size: 22px; font-weight: 650; letter-spacing: 1px; }
      #shape { color: var(--muted); font-size: 12px; }
      #traits { display: flex; gap: 8px; list-style: none; margin-top: 12px; flex-wrap: wrap; }
      #traits li {
        font-size: 12px; background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 999px; padding: 5px 12px;
      }
      #meeting, #naming .form-actions {
        display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; padding-top: 18px;
      }
      #naming { margin-top: auto; padding-top: 16px; }
      #naming[hidden], #meeting[hidden] { display: none; }
      #name {
        width: 100%; color: var(--yellow); background: #07091a; border: 1px solid var(--line);
        border-radius: 8px; padding: 11px 12px; outline: none; user-select: text;
      }
      #name:focus { border-color: var(--cyan); }
      #naming button { height: 40px; padding: 0 16px; }
      #hint { min-height: 18px; color: var(--muted); font-size: 12px; margin-top: 9px; }
      #hint.bad { color: var(--pink); }

      #choose { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
      .choose-head { padding: 23px 24px 17px; border-bottom: 1px solid var(--line); }
      .choose-head .eyebrow { color: var(--yellow); font-size: 10px; letter-spacing: 2.2px; }
      .choose-head h1 { margin-top: 8px; font-size: 20px; letter-spacing: .5px; }
      .choose-head p { color: var(--muted); font-size: 12px; line-height: 1.65; margin-top: 7px; }
      #breed-grid {
        min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
        gap: 10px; padding: 16px 22px 24px; scrollbar-color: #344773 transparent; scrollbar-width: thin;
      }
      #breed-grid::-webkit-scrollbar { width: 8px; }
      #breed-grid::-webkit-scrollbar-thumb {
        background: #344773; border-radius: 999px; border: 2px solid var(--panel);
      }
      .breed-card {
        position: relative; min-width: 0; height: 126px; padding: 8px 10px 10px;
        display: grid; grid-template-rows: 82px auto; align-items: center; overflow: hidden;
        background:
          radial-gradient(circle at 50% 35%, rgba(77, 238, 234, .08), transparent 55%),
          linear-gradient(180deg, #141b31, #0c1021);
        box-shadow: inset 0 1px rgba(255,255,255,.025);
      }
      .breed-card canvas {
        width: 112px; height: 82px; max-width: 100%; justify-self: center;
        image-rendering: pixelated; pointer-events: none;
      }
      .breed-card span {
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: #adb5d5; font-size: 13px; text-align: center;
      }
      .breed-card:hover:enabled { background-color: #17213a; }
      .breed-card[aria-selected='true'] {
        border-color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(77,238,234,.22), 0 0 20px rgba(77,238,234,.08);
      }
      .breed-card[aria-selected='true'] span { color: var(--cyan); }
      .breed-card[aria-selected='true']::after {
        content: ''; position: absolute; right: 10px; top: 10px; width: 7px; height: 7px;
        border-radius: 50%; background: var(--yellow); box-shadow: 0 0 8px rgba(255,217,74,.7);
      }
      #choose.locked-mode .choose-head p { color: var(--yellow); }
    </style>
  </head>
  <body>
    <main id="layout">
      <section id="encounter">
        <div id="night"><canvas id="sky"></canvas><canvas id="cat"></canvas></div>
        <div id="story">
          <p id="lede"></p>
          <div id="card"><span id="breed"></span><span id="shape"></span></div>
          <ul id="traits"></ul>
          <div id="meeting"><button id="keep" class="primary" type="button">确认领养</button></div>
          <form id="naming" hidden>
            <input id="name" type="text" autocomplete="off" placeholder="给它起个名字" />
            <div class="form-actions">
              <button id="back" type="button">再看看</button>
              <button id="confirm" class="primary" type="submit">带它回家</button>
            </div>
          </form>
          <p id="hint"></p>
        </div>
      </section>
      <aside id="choose">
        <div class="choose-head">
          <div class="eyebrow">CHOOSE YOUR CAT</div>
          <h1>选一只猫</h1>
          <p>每个品种都有固定的形象与完整动作。选中的就是以后陪在桌面上的那一只。</p>
        </div>
        <div id="breed-grid" role="listbox" aria-label="猫咪品种"></div>
      </aside>
    </main>
    <script type="module" src="/src/adopt/main.ts"></script>
  </body>
</html>
